version: '3.8'

services:
  f-shield:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - BLOCKCHAIN_MODE=${BLOCKCHAIN_MODE:-SIMULATED}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
